apiVersion: apps/v1
kind: Deployment
metadata:
  name: secureflow-app
  labels:
    app: secureflow-app
spec:
  replicas: 2
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: secureflow-app
  template:
    metadata:
      labels:
        app: secureflow-app
    spec:
      containers:
        - name: app
          image: ghcr.io/bhargavpyla/secureflow-app:a07c5f7

          ports:
            - containerPort: 8080

          # Neon PostgreSQL connection
          env:
            - name: NEON_URL
              valueFrom:
                secretKeyRef:
                  name: secureflow-neon
                  key: postgresql://neondb_owner:npg_c5ZOoeQf7Wqv@ep-polished-feather-b7rhqrp5-pooler.c-13.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false